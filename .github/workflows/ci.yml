name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -t tests
      - name: Workflow validation
        # Every shipped workflow must resolve all of its skill and agent workers.
        run: |
          python - <<'PY'
          import json, subprocess
          out = subprocess.run(
              ["lumos", "--project-dir", ".", "workflows", "--validate"],
              capture_output=True, text=True,
          ).stdout
          data = json.loads(out)
          invalid = [workflow for workflow in data["workflows"] if not workflow["valid"]]
          assert not invalid, f"workflow validation failed: {invalid}"
          print("workflow validation OK")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
