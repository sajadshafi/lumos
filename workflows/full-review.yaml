# Full review workflow — the complete chain from workflow-contract.md §4.
#
# Use for: schema migrations, authentication and permission changes, anything
# touching blob storage or PII, and endpoints on a hot listing path.

version: 1
name: full-review
description: Delivery pipeline with dedicated security and performance review gates.
max_total_stages: 60

stages:
  - skill: feature-planner
    description: Produce a file-level implementation plan grounded in the actual architecture.
    retry:
      max_attempts: 2

  - skill: coding
    description: Execute the approved plan exactly, with tests.
    retry:
      max_attempts: 3

  - skill: testing
    description: Close coverage gaps, especially failure modes and authorization paths.
    retry:
      max_attempts: 4

  - skill: reviewer
    description: Architectural conformance and correctness.
    retry:
      max_attempts: 2
    remediation:
      skill: fixer
      max_cycles: 3

  - skill: security
    description: Authorization, tenant isolation, injection surfaces, secret handling.
    retry:
      max_attempts: 2
    remediation:
      skill: fixer
      max_cycles: 2

  - skill: performance
    description: Query shape, N+1s, missing indexes, over-fetching on listing endpoints.
    retry:
      max_attempts: 2
    remediation:
      skill: fixer
      max_cycles: 2

  # A human signs off before the PR opens. The engine pauses here and will not
  # proceed until `lumos approve <run> --stage post-feature-implementation`.
  - skill: post-feature-implementation
    description: Update docs, compose the PR description, open the pull request.
    requires_approval: true
    retry:
      max_attempts: 2
